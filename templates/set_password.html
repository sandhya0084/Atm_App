{% extends "base.html" %}
{% set title = "Set Password" %}
{% set css_file = "pages.css" %}

{% block content %}
<h1>Change Password</h1>

{% if message %}
<p class="{{ msg_type }}">{{ message }}</p>
{% endif %}

<form method="post">
    <label>New Password:</label>
    <input type="password" name="password" required>

    <input type="submit" value="Update Password">
</form>
{% endblock %}
